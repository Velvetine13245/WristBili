services:
  - type: web
    name: wristbili-frame-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRAME_RATE
        value: "2"
      - key: MAX_FRAMES
        value: "600"
